[package]
name = "regard"
version = "0.1.0"
edition = "2021"
description = "Le regard : l'écran en données vivantes pour un agent, sans capture"
license = "MIT"

[dependencies]
atspi = { version = "0.30", default-features = false, features = ["proxies", "connection", "zbus", "tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["damage", "xfixes", "randr"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio-tungstenite = "0.28"
png = "0.17"
base64 = "0.22"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
